<svg xmlns="http://www.w3.org/2000/svg" width="712" height="356" viewBox="0 0 712 356">
  <defs>
    <marker id="arrow-black" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#222"/>
    </marker>
    <style>
      .sans { font-family: Arial, Helvetica, sans-serif; }
      .mono { font-family: "Courier New", Courier, monospace; }
    </style>
  </defs>

  <!-- top process boxes -->
  <rect x="6.5" y="10.5" width="207" height="75" rx="10" ry="10"
        fill="none" stroke="#ff7f0e" stroke-width="1.4"/>
  <text x="110" y="43" text-anchor="middle" class="sans" font-size="28" font-weight="700" fill="#f28c28">
    <tspan x="110" dy="0">procedural</tspan>
    <tspan x="110" dy="23">pretraining</tspan>
  </text>

  <rect x="256.5" y="10.5" width="207" height="75" rx="10" ry="10"
        fill="#ffffff" fill-opacity="0.0" stroke="#222" stroke-width="1.4"/>
  <text x="360" y="43" text-anchor="middle" class="sans" font-size="27" font-weight="700" fill="#111">
    <tspan x="360" dy="0">molecular</tspan>
    <tspan x="360" dy="23">pretraining</tspan>
  </text>

  <rect x="505.5" y="10.5" width="204" height="75" rx="10" ry="10"
        fill="#ffffff" fill-opacity="0.0" stroke="#222" stroke-width="1.4"/>
  <text x="607.5" y="54" text-anchor="middle" class="sans" font-size="27" font-weight="700" fill="#111">fine-tuning</text>

  <!-- arrows between boxes -->
  <line x1="217" y1="48" x2="251" y2="48" stroke="#222" stroke-width="1.5" marker-end="url(#arrow-black)"/>
  <line x1="467" y1="48" x2="501" y2="48" stroke="#222" stroke-width="1.5" marker-end="url(#arrow-black)"/>

  <!-- left example strings -->
  <text x="0" y="184" class="mono" font-size="25" fill="#1a1a1a">123456.65?3?1</text>
  <text x="87" y="272" class="mono" font-size="24" fill="#1a1a1a">({[?]}[])?}</text>

  <!-- curved arrows into procedural pretraining -->
  <path d="M54,154 C43,131 46,102 67,89" fill="none" stroke="#555" stroke-width="1.2" marker-end="url(#arrow-black)"/>
  <path d="M195,241 C219,190 209,123 175,90" fill="none" stroke="#555" stroke-width="1.2" marker-end="url(#arrow-black)"/>

  <!-- molecule sketch -->
  <g stroke="#111" stroke-width="1.5" fill="none">
    <!-- cyclohexane -->
    <path d="M349,180 L370,168 L391,180 L391,204 L370,216 L349,204 Z"/>
    <!-- side chain and carbonyl -->
    <path d="M349,204 L328,216 L307,205"/>
    <line x1="328" y1="216" x2="328" y2="232"/>
    <line x1="324" y1="216" x2="324" y2="232"/>
  </g>
  <text x="328" y="252" text-anchor="middle" class="sans" font-size="24" fill="#111">O</text>

  <!-- molecular text -->
  <text x="262" y="315" class="mono" font-size="24" fill="#1a1a1a">C?(=O)C1C?CCC1</text>

  <!-- curved arrows into molecular pretraining -->
  <path d="M431,275 C450,238 453,178 440,130 C434,109 424,97 407,90"
        fill="none" stroke="#555" stroke-width="1.2" marker-end="url(#arrow-black)"/>

  <!-- fine-tuning plot -->
  <g>
    <!-- legend -->
    <line x1="493" y1="102" x2="519" y2="102" stroke="#ff7f0e" stroke-width="2.2"/>
    <text x="530" y="109" class="sans" font-size="23" fill="#5b5b5b">with proc. pt.</text>
    <line x1="493" y1="128" x2="519" y2="128" stroke="#8c8c8c" stroke-width="2.2"/>
    <text x="530" y="136" class="sans" font-size="23" fill="#5b5b5b">without proc. pt.</text>

    <!-- axes -->
    <line x1="513" y1="295" x2="685" y2="295" stroke="#777" stroke-width="1.3"/>
    <line x1="513" y1="295" x2="513" y2="157" stroke="#777" stroke-width="1.3"/>

    <!-- curves -->
    <path d="M514,200 C527,232 547,252 572,267 C599,282 636,286 684,286"
          fill="none" stroke="#ff7f0e" stroke-width="2.2"/>
    <path d="M514,165 C529,206 553,231 584,246 C610,258 642,263 684,264"
          fill="none" stroke="#8c8c8c" stroke-width="2.2"/>

    <!-- axis labels -->
    <text x="599" y="317" text-anchor="middle" class="sans" font-size="23" fill="#5b5b5b">training step</text>
    <text x="504" y="228" text-anchor="middle" class="sans" font-size="23" fill="#5b5b5b"
          transform="rotate(-90 504 228)">error</text>
  </g>
</svg>