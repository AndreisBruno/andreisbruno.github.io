<svg xmlns="http://www.w3.org/2000/svg" width="453" height="360" viewBox="0 0 453 360">
  <defs>
    <style>
      .math { font-family: "Times New Roman", serif; font-style: italic; fill:#111; }
      .sans { font-family: Arial, Helvetica, sans-serif; fill:#174e6b; font-size:13px; }
      .small { font-family: Arial, Helvetica, sans-serif; font-size:13px; }
      .redtxt { font-family: Arial, Helvetica, sans-serif; font-size:13px; fill:#d71920; }
      .greentxt { font-family: Arial, Helvetica, sans-serif; font-size:13px; fill:#2d7d32; }
      .arrow { stroke:#888; stroke-width:2.5; fill:none; stroke-linecap:round; stroke-linejoin:round; }
      .rarrow { stroke:#ff8088; stroke-width:2.4; fill:none; stroke-linecap:round; stroke-linejoin:round; }
      .dash { stroke:#21b54b; stroke-width:1.4; stroke-dasharray:4 2; fill:#dff7e1; fill-opacity:.82; }
    </style>
    <marker id="arrowGray" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
    <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#ff8088"/>
    </marker>
    <filter id="blurDot" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="1.8"/>
    </filter>
  </defs>

  <!-- top dynamics -->
  <text x="123" y="12" class="math" font-size="18">a<tspan dy="4" font-size="12">t</tspan></text>
  <line x1="153" y1="8" x2="171" y2="8" class="arrow" marker-end="url(#arrowGray)"/>
  <line x1="153" y1="22" x2="171" y2="22" class="arrow" marker-end="url(#arrowGray)"/>

  <rect x="173" y="1" rx="4" ry="4" width="100" height="26" fill="#dbeaf8"/>
  <text x="223" y="18" text-anchor="middle" class="sans">Predictor</text>
  <line x1="273" y1="13" x2="376" y2="13" class="arrow" marker-end="url(#arrowGray)"/>
  <text x="386" y="24" class="math" font-size="18">ẑ<tspan dy="4" font-size="12">t+1</tspan></text>

  <!-- left z path -->
  <polyline points="41,60 41,20 166,20" class="arrow" marker-end="url(#arrowGray)"/>
  <text x="33" y="86" class="math" font-size="18">z<tspan dy="4" font-size="12">t</tspan></text>

  <!-- right z path -->
  <line x1="383" y1="68" x2="276" y2="68" class="arrow" marker-end="url(#arrowGray)"/>
  <text x="387" y="87" class="math" font-size="18">z<tspan dy="4" font-size="12">t+1</tspan></text>

  <!-- MSE top -->
  <line x1="406" y1="29" x2="406" y2="60" class="rarrow" marker-end="url(#arrowRed)"/>
  <line x1="406" y1="60" x2="406" y2="29" class="rarrow" marker-end="url(#arrowRed)"/>
  <rect x="413" y="36" rx="3" width="40" height="19" fill="#ffd7da"/>
  <text x="433" y="50" text-anchor="middle" class="redtxt">MSE</text>

  <!-- central green region -->
  <rect x="96" y="46" rx="14" ry="14" width="254" height="304" class="dash"/>

  <!-- Diff Predictor -->
  <rect x="172" y="55" rx="4" width="100" height="27" fill="#bcefc3"/>
  <text x="222" y="73" text-anchor="middle" class="greentxt">Diff Predictor</text>
  <line x1="222" y1="82" x2="222" y2="98" class="arrow" marker-end="url(#arrowGray)"/>

  <text x="214" y="124" class="math" font-size="18">d̃<tspan dy="4" font-size="12">t</tspan></text>

  <!-- SIGReg side arrows -->
  <line x1="56" y1="93" x2="105" y2="93" class="rarrow" marker-end="url(#arrowRed)"/>
  <rect x="106" y="84" rx="3" width="64" height="19" fill="#ffd7da"/>
  <text x="138" y="98" text-anchor="middle" class="redtxt">SIGReg</text>

  <line x1="383" y1="93" x2="338" y2="93" class="rarrow" marker-end="url(#arrowRed)"/>
  <rect x="274" y="84" rx="3" width="65" height="19" fill="#ffd7da"/>
  <text x="306" y="98" text-anchor="middle" class="redtxt">SIGReg</text>

  <!-- center red losses -->
  <line x1="222" y1="126" x2="222" y2="152" class="rarrow" marker-end="url(#arrowRed)"/>
  <line x1="222" y1="152" x2="222" y2="126" class="rarrow" marker-end="url(#arrowRed)"/>
  <rect x="231" y="130" rx="3" width="42" height="19" fill="#ffd7da"/>
  <text x="252" y="144" text-anchor="middle" class="redtxt">MSE</text>

  <text x="213" y="174" class="math" font-size="18">d̂<tspan dy="4" font-size="12">t</tspan></text>
  <line x1="232" y1="166" x2="259" y2="166" class="rarrow" marker-end="url(#arrowRed)"/>
  <rect x="260" y="156" rx="3" width="62" height="19" fill="#ffd7da"/>
  <text x="291" y="170" text-anchor="middle" class="redtxt">SIGReg</text>

  <!-- Diff Encoder -->
  <rect x="173" y="193" rx="5" width="100" height="27" fill="#bcefc3"/>
  <text x="223" y="211" text-anchor="middle" class="greentxt">Diff Encoder</text>
  <line x1="223" y1="193" x2="223" y2="183" class="arrow" marker-end="url(#arrowGray)"/>

  <!-- central observation difference image -->
  <rect x="182" y="230" width="82" height="82" fill="#888"/>
  <circle cx="230" cy="247" r="4.5" fill="#ff6b6b" filter="url(#blurDot)"/>
  <circle cx="230" cy="247" r="2.4" fill="#ff7777"/>
  <circle cx="245" cy="265" r="4.5" fill="#008c95" filter="url(#blurDot)"/>
  <circle cx="245" cy="265" r="2.6" fill="#008895"/>
  <text x="223" y="332" text-anchor="middle" class="math" font-size="18">o<tspan dy="4" font-size="12">t+1</tspan><tspan dy="-4" font-size="18"> − o</tspan><tspan dy="4" font-size="12">t</tspan></text>

  <!-- DISReg -->
  <rect x="188" y="343" rx="3" width="69" height="17" fill="#d3f2d5"/>
  <text x="222.5" y="356" text-anchor="middle" class="greentxt">DISReg</text>

  <!-- left encoder and frame -->
  <rect x="0" y="194" rx="5" width="82" height="26" fill="#dbeaf8"/>
  <text x="41" y="212" text-anchor="middle" class="sans">Encoder</text>
  <line x1="41" y1="194" x2="41" y2="94" class="arrow" marker-end="url(#arrowGray)"/>
  <line x1="41" y1="220" x2="41" y2="241" stroke="#888" stroke-width="2.5"/>
  <line x1="41" y1="231" x2="41" y2="242" stroke="#111" stroke-width="4"/>

  <!-- left small court -->
  <line x1="4" y1="230" x2="4" y2="311" stroke="#111" stroke-width="1"/>
  <line x1="78" y1="230" x2="78" y2="311" stroke="#111" stroke-width="1"/>
  <line x1="0" y1="234" x2="81" y2="234" stroke="#111" stroke-width="1"/>
  <line x1="0" y1="307" x2="81" y2="307" stroke="#111" stroke-width="1"/>
  <line x1="41" y1="253" x2="41" y2="310" stroke="#111" stroke-width="4"/>
  <circle cx="61" cy="264" r="4" fill="#ff1f2d" filter="url(#blurDot)"/>
  <circle cx="61" cy="264" r="2.3" fill="#ff1f2d"/>
  <text x="31" y="333" class="math" font-size="18">o<tspan dy="4" font-size="12">t</tspan></text>

  <!-- right encoder and frame -->
  <rect x="365" y="194" rx="5" width="82" height="26" fill="#dbeaf8"/>
  <text x="406" y="212" text-anchor="middle" class="sans">Encoder</text>
  <line x1="406" y1="194" x2="406" y2="94" class="arrow" marker-end="url(#arrowGray)"/>
  <line x1="406" y1="220" x2="406" y2="241" stroke="#888" stroke-width="2.5"/>
  <line x1="406" y1="231" x2="406" y2="242" stroke="#111" stroke-width="4"/>

  <!-- right small court -->
  <line x1="369" y1="230" x2="369" y2="311" stroke="#111" stroke-width="1"/>
  <line x1="443" y1="230" x2="443" y2="311" stroke="#111" stroke-width="1"/>
  <line x1="365" y1="234" x2="447" y2="234" stroke="#111" stroke-width="1"/>
  <line x1="365" y1="307" x2="447" y2="307" stroke="#111" stroke-width="1"/>
  <line x1="406" y1="253" x2="406" y2="310" stroke="#111" stroke-width="4"/>
  <circle cx="418" cy="246" r="4" fill="#ff1f2d" filter="url(#blurDot)"/>
  <circle cx="418" cy="246" r="2.3" fill="#ff1f2d"/>
  <text x="390" y="333" class="math" font-size="18">o<tspan dy="4" font-size="12">t+1</tspan></text>
</svg>